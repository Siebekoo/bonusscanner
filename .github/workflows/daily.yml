# Runs the scanner every morning on GitHub's servers and publishes the page with GitHub Pages.
name: Daily deals

on:
  # Main trigger: cron-job.org starts this every morning at 06:00 via "Run workflow"
  # (see README). GitHub's own schedule below is only a backup: it often starts hours late,
  # and it skips itself when today's update already happened.
  schedule:
    - cron: "15 5 * * *"     # 06:15 in winter, 07:15 in summer (NL time)
    - cron: "45 6 * * *"     # 07:45 / 08:45
  workflow_dispatch:          # adds a "Run workflow" button for running it by hand
  push:
    paths: ["pushed/**"]      # your PC uploaded new deals: rebuild the site

permissions:
  contents: write     # to save the daily price history back into the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Scheduled (backup) runs only do something if today's update didn't happen yet.
      - name: Already updated today?
        if: github.event_name == 'schedule'
        run: |
          if [ -f "history/$(TZ=Europe/Amsterdam date +%F).json.gz" ]; then
            echo "Already updated today, nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: env.SKIP != '1'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # xvfb gives the "retry with a normal browser window" step a virtual screen.
      # If no store returns anything, scan.py fails and yesterday's page stays online.
      - name: Scan stores
        if: env.SKIP != '1'
        run: xvfb-run -a python scan.py

      # Keeps a small file per day in history/ so the page can show
      # "Beste prijs in 8 weken" etc. The daily commit should also count as activity,
      # so GitHub is less likely to switch off the schedule after 60 days.
      - name: Save price history
        if: env.SKIP != '1'
        run: |
          git config user.name "bonusscanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "Price history $(date +%F)"
          git pull --rebase --autostash
          git push

      - name: Prepare site
        if: env.SKIP != '1'
        run: cp output/deals.html output/index.html

      - uses: actions/upload-pages-artifact@v3
        if: env.SKIP != '1'
        with:
          path: output

      - id: deploy
        if: env.SKIP != '1'
        uses: actions/deploy-pages@v4
