# Runs the scanner every morning on GitHub's servers and publishes the page with GitHub Pages.
name: Daily deals

on:
  schedule:
    - cron: "15 5 * * *"     # 05:15 UTC = 06:15 in winter, 07:15 in summer (NL time)
  workflow_dispatch:          # adds a "Run workflow" button for running it by hand

permissions:
  contents: write     # to save the daily price history back into the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # xvfb gives the "retry with a normal browser window" step a virtual screen.
      # If no store returns anything, scan.py fails and yesterday's page stays online.
      - name: Scan stores
        run: xvfb-run -a python scan.py

      # Keeps a small file per day in history/ so the page can show
      # "Beste prijs in 8 weken" etc. The daily commit should also count as activity,
      # so GitHub is less likely to switch off the schedule after 60 days.
      - name: Save price history
        run: |
          git config user.name "bonusscanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "Price history $(date +%F)"
          git pull --rebase --autostash
          git push

      - name: Prepare site
        run: cp output/deals.html output/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - id: deploy
        uses: actions/deploy-pages@v4
