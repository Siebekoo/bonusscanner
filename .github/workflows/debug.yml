# Temporary: scan, then test a sample of product links per store; results saved to this branch.
name: Debug links
on:
  push:
    branches: [debug-links]
    paths: [".github/workflows/debug.yml"]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scan.py --debug --only jumbo,hoogvliet,aldi,lidl,kruidvat --no-history --no-prices || true
      - run: PYTHONPATH=. xvfb-run -a python tools/check_links.py
      - run: |
          git config user.name "bonusscanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-output && git commit -m "Link check output" && git push
